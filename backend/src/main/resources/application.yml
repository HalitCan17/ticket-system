spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
