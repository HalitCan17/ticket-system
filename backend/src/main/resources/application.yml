spring:
  application:
    name: itsm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # `iss` claim the tokens must carry (the public Keycloak URL).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/itsm}
          # Where signing keys are fetched; in Docker this is the internal Keycloak URL.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/itsm/protocol/openid-connect/certs}
          audiences: itsm-backend

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
