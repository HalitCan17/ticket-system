# Read at build time by kogito-maven-plugin (it does not read application.yml).
# Do not generate REST controllers for BPMN processes / user tasks; processes are driven
# through our own service layer (docs/jbpm-spike.md, docs/adr/0004-keycloak-jwt-resource-server.md).
kogito.generate.rest=false

# Process instances are stored in Postgres (kie-addons-springboot-persistence-jdbc).
kogito.persistence.type=jdbc
