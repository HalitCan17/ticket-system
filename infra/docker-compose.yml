name: itsm

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    image: itsm-backend:0.0.1-SNAPSHOT
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-itsm}
      DB_USERNAME: ${POSTGRES_USER:-itsm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  pgdata:
