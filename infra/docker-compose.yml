name: itsm

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
      # Used by postgres/init/01-keycloak.sh (runs only on an empty volume)
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # start-dev: HTTP, no TLS. Local development only.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry iss=http://localhost:<port>/realms/itsm, also when the backend
      # talks to Keycloak over the internal network (backchannel).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/itsm-realm.json:/opt/keycloak/data/import/itsm-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 15

  backend:
    build:
      context: ../backend
    image: itsm-backend:0.0.1-SNAPSHOT
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-itsm}
      DB_USERNAME: ${POSTGRES_USER:-itsm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
      # Tokens are issued for the public URL; signing keys are fetched over the internal network.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/itsm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/itsm/protocol/openid-connect/certs
      # itsm.auto-close.* (dashes are dropped in environment variable names)
      ITSM_AUTOCLOSE_AFTER: ${ITSM_AUTOCLOSE_AFTER:-7d}
      ITSM_AUTOCLOSE_POLLINTERVAL: ${ITSM_AUTOCLOSE_POLLINTERVAL:-60s}
      ITSM_ATTACHMENTS_DIR: /data/attachments
    volumes:
      # Attachment contents (metadata is in Postgres); keep together with pgdata when backing up.
      - attachments:/data/attachments
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  web:
    build:
      context: ../web
      args:
        # Public Keycloak URL as seen by the browser
        VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8081}
    image: itsm-web:0.0.1
    ports:
      # Must match the itsm-web client's redirect URIs in keycloak/itsm-realm.json
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Observability (local development only; see docs/adr/0009-observability.md) ---
  # backend (OpenTelemetry Java agent) --OTLP--> data-prepper --> opensearch <-- opensearch-dashboards

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      # No TLS / users: ports are bound to localhost only. Never expose this setup.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 15

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 15

  # One-shot: creates the otel-logs-* index pattern so logs are searchable in Discover; exits afterwards.
  dashboards-init:
    image: opensearchproject/opensearch:3.6.0
    entrypoint:
      - curl
      - -fsS
      - -X
      - POST
      - http://opensearch-dashboards:5601/api/saved_objects/index-pattern/otel-logs?overwrite=true
      - -H
      - "osd-xsrf: true"
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"attributes":{"title":"otel-logs-*","timeFieldName":"time"}}'
    restart: "no"
    depends_on:
      opensearch-dashboards:
        condition: service_healthy

  data-prepper:
    image: opensearchproject/data-prepper:2.16.0
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  pgdata:
  attachments:
  osdata:
