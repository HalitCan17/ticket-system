server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Attachments are limited to 10 MB by the backend; allow some multipart overhead.
    client_max_body_size 11m;

    # Set only here: an add_header inside a location would drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin API: the browser never talks to the backend directly, so no CORS is needed.
    location /api/ {
        proxy_pass http://backend:8080;
        # Spring Security sets these too; hide its copies so the headers above are not duplicated.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/tickets/42) are served by index.html, which must not be cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
